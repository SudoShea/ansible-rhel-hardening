---
- name: Reload audit rules
  ansible.builtin.command:
    cmd: augenrules --load
  failed_when: false
  changed_when: true

- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Restart sshd
  ansible.builtin.service:
    name: "{{ (ansible_facts['os_family'] == 'Debian') | ternary('ssh', 'sshd') }}"
    state: restarted
